<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisioWAve</title>
  <style>
    :root {
      --bg: #05070a;
      --panel: rgba(255, 255, 255, 0.07);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #e8eef5;
      --muted: #8c98a8;
      --accent: #1db954;
      --danger: #ff5c7a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(29, 185, 84, 0.14), transparent 34%),
        radial-gradient(circle at 80% 80%, rgba(82, 120, 255, 0.16), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      width: min(420px, calc(100vw - 40px));
      padding: 18px;
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      background: rgba(5, 7, 10, 0.72);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);
      z-index: 10;
    }

    .hud h1 {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .hud p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button, select, input[type="range"], input[type="text"] {
      width: 100%;
    }

    button, select, input[type="text"] {
      height: 38px;
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    input[type="text"] {
      padding: 0 12px;
    }

    input[type="text"]::placeholder {
      color: rgba(140, 152, 168, 0.75);
    }

    input[type="text"]:focus {
      border-color: rgba(29, 185, 84, 0.45);
    }

    .row.full {
      grid-template-columns: 1fr;
    }

    button {
      cursor: pointer;
      font-weight: 650;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.26);
      background: rgba(255, 255, 255, 0.11);
    }

    button.primary {
      background: rgba(29, 185, 84, 0.16);
      border-color: rgba(29, 185, 84, 0.45);
      color: #dbffe8;
    }

    button.danger {
      background: rgba(255, 92, 122, 0.12);
      border-color: rgba(255, 92, 122, 0.36);
      color: #ffd9e1;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    input[type="range"] {
      accent-color: var(--accent);
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 14px currentColor;
    }

    .dot.active {
      background: var(--accent);
    }

    .source-overlay {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      max-width: min(640px, calc(100vw - 40px));
      padding: 12px 20px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: rgba(5, 7, 10, 0.55);
      backdrop-filter: blur(12px);
      text-align: center;
      pointer-events: none;
      z-index: 8;
      transition: opacity 220ms ease;
    }

    .source-overlay.is-idle {
      opacity: 0.72;
    }

    .source-overlay .source-title {
      margin: 0 0 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .source-overlay .source-label {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-overlay .source-kind {
      margin: 5px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .note {
      position: absolute;
      right: 20px;
      bottom: 20px;
      width: min(440px, calc(100vw - 40px));
      padding: 14px 16px;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      background: rgba(5, 7, 10, 0.58);
      backdrop-filter: blur(14px);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      z-index: 9;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 720px) {
      .hud {
        top: 12px;
        left: 12px;
        width: calc(100vw - 24px);
      }

      .source-overlay {
        bottom: 14px;
        max-width: calc(100vw - 24px);
        padding: 10px 14px;
      }

      .source-overlay .source-label {
        font-size: 13px;
      }

      .note {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <canvas id="visualizer"></canvas>

    <div id="sourceOverlay" class="source-overlay is-idle" aria-live="polite">
      <p id="sourceTitleHead" class="source-title">Сейчас играет</p>
      <p id="sourceLabel" class="source-label">Нет активного захвата</p>
      <p id="sourceKind" class="source-kind">Захватите звук, чтобы увидеть источник</p>
    </div>

    <section class="hud">
      <h1>Winamp‑style Visualizer</h1>
      <p>
        Запусти источник звука, нажми «Захватить звук» и выбери системный звук/вкладку или микрофон.
      </p>

      <div class="controls">
        <div class="row">
          <button id="startBtn" class="primary">Захватить звук</button>
          <button id="stopBtn" class="danger">Остановить</button>
        </div>
        <!-- Need to redesign this part for better UX, maybe add support for fetching track title from Spotify Web API in future versions
        <div class="row full">
          <label>
            Название на оверлее
            <input
              id="trackTitleInput"
              type="text"
              maxlength="120"
              placeholder="Например: Artist — Track"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
        </div>
        -->
        <div class="row">
          <label>
            Источник
            <select id="sourceSelect">
              <option value="display">Системный звук / вкладка</option>
              <option value="mic">Микрофон</option>
            </select>
          </label>

          <label>
            Режим
            <select id="modeSelect">
              <option value="bars">Spectrum Bars</option>
              <option value="circle">Radial Spectrum</option>
              <option value="wave">Waveform Tunnel</option>
              <!-- Требует оптимизации для стабильной работы на 60 FPS, особенно на мобильных устройствах. Планируется добавить в будущих версиях.
              <option value="particles">Particle Field</option>
              -->
            </select>
          </label>
        </div>

        <div class="row">
          <label>
            Сглаживание
            <input id="smoothRange" type="range" min="0" max="95" value="82" />
          </label>

          <label>
            Чувствительность
            <input id="gainRange" type="range" min="40" max="260" value="135" />
          </label>
        </div>

        <div class="row">
          <label>
            Затухание следа
            <input id="trailRange" type="range" min="3" max="35" value="13" />
          </label>
        </div>

        <div class="status">
          <span class="pill"><span id="statusDot" class="dot"></span><span id="statusText">нет аудиопотока</span></span>
          <span id="fpsText">0 FPS</span>
        </div>
      </div>
    </section>
    <!-- Ask for delete this info -->
    <!--
    <aside class="note">
      В Chrome/Edge при выборе вкладки можно включить «Share tab audio». Для Spotify Desktop захватывай экран/системный звук, если ОС и браузер это позволяют. Это обходной путь: Spotify не отдаёт сырой PCM‑поток через Web API.
    </aside>
    -->
  </div>

  <script>
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const sourceSelect = document.getElementById('sourceSelect');
    const modeSelect = document.getElementById('modeSelect');
    const smoothRange = document.getElementById('smoothRange');
    const gainRange = document.getElementById('gainRange');
    const trailRange = document.getElementById('trailRange');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const fpsText = document.getElementById('fpsText');
    const sourceOverlay = document.getElementById('sourceOverlay');
    const sourceTitleHead = document.getElementById('sourceTitleHead');
    const sourceLabel = document.getElementById('sourceLabel');
    const sourceKind = document.getElementById('sourceKind');
    const trackTitleInput = document.getElementById('trackTitleInput');

    const TRACK_TITLE_STORAGE_KEY = 'visualizer-track-title';
    let capturedTrackLabel = '';

    let audioContext = null;
    let analyser = null;
    let source = null;
    let stream = null;
    let freqData = null;
    let timeData = null;
    let animationId = null;
    let particles = [];
    let lastFrameTime = performance.now();
    let fpsAccumulator = 0;
    let fpsFrames = 0;
    let fpsLastUpdate = performance.now();

    const state = {
      width: 0,
      height: 0,
      dpr: 1,
      hue: 135,
      energy: 0,
      bass: 0,
      mid: 0,
      treble: 0
    };

    function resize() {
      state.dpr = Math.min(window.devicePixelRatio || 1, 2);
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = Math.floor(state.width * state.dpr);
      canvas.height = Math.floor(state.height * state.dpr);
      canvas.style.width = state.width + 'px';
      canvas.style.height = state.height + 'px';
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    }

    window.addEventListener('resize', resize);
    resize();

    function setStatus(active, text) {
      statusDot.classList.toggle('active', active);
      statusText.textContent = text;
    }

    function sourceKindLabel() {
      return sourceSelect.value === 'mic' ? 'Микрофон' : 'Системный звук / вкладка';
    }

    function getCustomTitle() {
      return trackTitleInput ? trackTitleInput.value.trim() : '';
    }

    function setSourceOverlay(active, label, kind, head) {
      sourceOverlay.classList.toggle('is-idle', !active);
      sourceTitleHead.textContent = head;
      sourceLabel.textContent = label;
      sourceKind.textContent = kind;
    }

    function overlaySubtitle(active) {
      const parts = [];
      if (active && capturedTrackLabel && getCustomTitle()) {
        parts.push(capturedTrackLabel);
      }
      parts.push(sourceKindLabel());
      if (active) return parts.join(' · ');
      return 'Выбрано: ' + sourceKindLabel() + ' · нажмите «Захватить звук»';
    }

    function refreshSourceOverlay() {
      const custom = getCustomTitle();
      const active = !!stream;

      if (active) {
        const main = custom || capturedTrackLabel || sourceKindLabel();
        const head = custom ? 'Сейчас играет' : 'Источник';
        setSourceOverlay(true, main, overlaySubtitle(true), head);
        return;
      }

      if (custom) {
        setSourceOverlay(false, custom, overlaySubtitle(false), 'Сейчас играет');
        return;
      }

      setSourceOverlay(
        false,
        'Нет активного захвата',
        overlaySubtitle(false),
        'Источник'
      );
    }

    function updateSourceOverlayFromTrack(track) {
      capturedTrackLabel = (track && track.label && track.label.trim())
        ? track.label.trim()
        : '';
      refreshSourceOverlay();
    }

    function resetSourceOverlay() {
      capturedTrackLabel = '';
      refreshSourceOverlay();
    }

    function loadSavedTrackTitle() {
      if (!trackTitleInput) return;
      try {
        const saved = localStorage.getItem(TRACK_TITLE_STORAGE_KEY);
        if (saved) trackTitleInput.value = saved;
      } catch (_) {}
    }

    function saveTrackTitle() {
      if (!trackTitleInput) return;
      try {
        const value = trackTitleInput.value;
        if (value.trim()) {
          localStorage.setItem(TRACK_TITLE_STORAGE_KEY, value);
        } else {
          localStorage.removeItem(TRACK_TITLE_STORAGE_KEY);
        }
      } catch (_) {}
    }

    function createParticles(count = 520) {
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * state.width,
        y: Math.random() * state.height,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7,
        r: 1 + Math.random() * 2.8,
        phase: Math.random() * Math.PI * 2
      }));
    }

    createParticles();

    async function startCapture() {
      stopCapture();

      try {
        if (sourceSelect.value === 'mic') {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } else {
          stream = await navigator.mediaDevices.getDisplayMedia({
            video: true,
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });
        }

        const audioTracks = stream.getAudioTracks();
        if (audioTracks.length === 0) {
          setStatus(false, 'аудио не выбрано');
          alert(sourceSelect.value === 'mic'
            ? 'Не удалось получить доступ к микрофону. Проверьте разрешения.'
            : 'В выбранном источнике нет аудио. В Chrome выбери вкладку и включи Share tab audio.');
          stopCapture();
          return;
        }

        audioContext = new AudioContext();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        analyser.minDecibels = -92;
        analyser.maxDecibels = -12;
        analyser.smoothingTimeConstant = Number(smoothRange.value) / 100;

        source = audioContext.createMediaStreamSource(stream);
        source.connect(analyser);

        freqData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.fftSize);

        stream.getVideoTracks().forEach(track => {
          track.enabled = false;
          track.stop();
        });

        audioTracks[0].addEventListener('ended', stopCapture);
        updateSourceOverlayFromTrack(audioTracks[0]);
        setStatus(true, 'аудиопоток активен');
        animate();
      } catch (error) {
        console.error(error);
        setStatus(false, 'захват отменён или запрещён');
      }
    }

    function stopCapture() {
      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      if (source) {
        try { source.disconnect(); } catch (_) {}
        source = null;
      }

      if (audioContext) {
        audioContext.close().catch(() => {});
        audioContext = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      analyser = null;
      freqData = null;
      timeData = null;
      setStatus(false, 'нет аудиопотока');
      resetSourceOverlay();

      if (!animationId) {
        animate();
      }
    }

    sourceSelect.addEventListener('change', refreshSourceOverlay);

    if (trackTitleInput) {
      trackTitleInput.addEventListener('input', () => {
        saveTrackTitle();
        refreshSourceOverlay();
      });
    }

    loadSavedTrackTitle();
    refreshSourceOverlay();

    startBtn.addEventListener('click', startCapture);
    stopBtn.addEventListener('click', stopCapture);

    smoothRange.addEventListener('input', () => {
      if (analyser) analyser.smoothingTimeConstant = Number(smoothRange.value) / 100;
    });

    function updateAudioMetrics() {
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);

      const gain = Number(gainRange.value) / 100;
      const len = freqData.length;
      const bassEnd = Math.floor(len * 0.08);
      const midEnd = Math.floor(len * 0.38);

      let bass = 0, mid = 0, treble = 0, total = 0;

      for (let i = 0; i < len; i++) {
        const v = Math.min(255, freqData[i] * gain);
        total += v;
        if (i < bassEnd) bass += v;
        else if (i < midEnd) mid += v;
        else treble += v;
      }

      state.bass = bass / Math.max(1, bassEnd) / 255;
      state.mid = mid / Math.max(1, midEnd - bassEnd) / 255;
      state.treble = treble / Math.max(1, len - midEnd) / 255;
      state.energy = total / len / 255;
      state.hue = (state.hue + 0.18 + state.energy * 2.1) % 360;
    }

    function fadeCanvas() {
      const alpha = Number(trailRange.value) / 100;
      ctx.fillStyle = `rgba(5, 7, 10, ${alpha})`;
      ctx.fillRect(0, 0, state.width, state.height);
    }

    function drawBars() {
      const bars = 96;
      const step = Math.floor(freqData.length / bars);
      const gap = 3;
      const barWidth = state.width / bars;
      const baseline = state.height * 0.82;

      ctx.save();
      ctx.shadowBlur = 18 + state.energy * 30;

      for (let i = 0; i < bars; i++) {
        let sum = 0;
        for (let j = 0; j < step; j++) sum += freqData[i * step + j] || 0;
        const value = sum / step / 255;
        const h = Math.pow(value, 1.28) * state.height * 0.68;
        const hue = (state.hue + i * 1.8 + value * 80) % 360;

        ctx.fillStyle = `hsl(${hue}, 84%, ${48 + value * 22}%)`;
        ctx.shadowColor = ctx.fillStyle;
        ctx.fillRect(i * barWidth + gap / 2, baseline - h, Math.max(1, barWidth - gap), h);

        ctx.globalAlpha = 0.22;
        ctx.fillRect(i * barWidth + gap / 2, baseline + 6, Math.max(1, barWidth - gap), h * 0.32);
        ctx.globalAlpha = 1;
      }

      ctx.restore();
    }

    function drawCircle() {
      const cx = state.width / 2;
      const cy = state.height / 2;
      const radius = Math.min(state.width, state.height) * (0.17 + state.bass * 0.05);
      const points = 192;
      const step = Math.floor(freqData.length / points);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(performance.now() * 0.00008);
      ctx.lineWidth = 2;
      ctx.shadowBlur = 24 + state.energy * 36;

      for (let layer = 0; layer < 3; layer++) {
        ctx.beginPath();
        for (let i = 0; i <= points; i++) {
          const idx = (i % points) * step;
          const v = (freqData[idx] || 0) / 255;
          const angle = (i / points) * Math.PI * 2;
          const wave = Math.sin(angle * (3 + layer) + performance.now() * 0.001) * 8;
          const r = radius + layer * 32 + Math.pow(v, 1.2) * (130 + layer * 42) + wave;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        const hue = (state.hue + layer * 46) % 360;
        ctx.strokeStyle = `hsla(${hue}, 88%, 62%, ${0.92 - layer * 0.18})`;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(0, 0, radius * (0.72 + state.bass * 0.22), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${state.hue}, 70%, 52%, ${0.08 + state.bass * 0.16})`;
      ctx.fill();
      ctx.restore();
    }

    function drawWaveTunnel() {
      const cx = state.width / 2;
      const cy = state.height / 2;
      const samples = 256;
      const rings = 18;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.lineWidth = 1.4;
      ctx.shadowBlur = 20;

      for (let r = 1; r <= rings; r++) {
        const scale = r / rings;
        const baseRadius = Math.min(state.width, state.height) * scale * 0.48;
        const alpha = 0.07 + scale * 0.38;
        const timeOffset = performance.now() * 0.0004 + r * 0.31;

        ctx.beginPath();
        for (let i = 0; i <= samples; i++) {
          const idx = Math.floor((i / samples) * timeData.length);
          const t = ((timeData[idx] || 128) - 128) / 128;
          const angle = (i / samples) * Math.PI * 2;
          const distortion = t * (30 + state.energy * 80) * scale;
          const spiral = Math.sin(angle * 5 + timeOffset) * 10 * state.mid;
          const rr = baseRadius + distortion + spiral;
          const x = Math.cos(angle + timeOffset * 0.16) * rr;
          const y = Math.sin(angle + timeOffset * 0.16) * rr;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        const hue = (state.hue + r * 9) % 360;
        ctx.strokeStyle = `hsla(${hue}, 88%, 62%, ${alpha})`;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawParticles(delta) {
      const cx = state.width / 2;
      const cy = state.height / 2;
      const pull = 0.0006 + state.bass * 0.008;
      const expansion = 0.42 + state.energy * 4.2;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.shadowBlur = 18 + state.energy * 32;

      for (const p of particles) {
        const dx = p.x - cx;
        const dy = p.y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const nx = dx / dist;
        const ny = dy / dist;

        p.phase += delta * (0.0014 + state.treble * 0.009);
        p.vx += nx * expansion * 0.014 - dx * pull;
        p.vy += ny * expansion * 0.014 - dy * pull;
        p.vx += Math.cos(p.phase) * 0.024 * state.mid;
        p.vy += Math.sin(p.phase) * 0.024 * state.mid;
        p.vx *= 0.968;
        p.vy *= 0.968;
        p.x += p.vx * delta * 0.1;
        p.y += p.vy * delta * 0.1;

        if (p.x < -60 || p.x > state.width + 60 || p.y < -60 || p.y > state.height + 60) {
          p.x = cx + (Math.random() - 0.5) * 140;
          p.y = cy + (Math.random() - 0.5) * 140;
          p.vx = (Math.random() - 0.5) * 0.8;
          p.vy = (Math.random() - 0.5) * 0.8;
        }

        const hue = (state.hue + dist * 0.09 + p.phase * 14) % 360;
        const size = p.r * (1 + state.energy * 4.2);
        ctx.beginPath();
        ctx.fillStyle = `hsla(${hue}, 92%, 64%, ${0.24 + state.energy * 0.56})`;
        ctx.shadowColor = ctx.fillStyle;
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawIdle() {
      fadeCanvas();
      const t = performance.now() * 0.001;
      const cx = state.width / 2;
      const cy = state.height / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 9; i++) {
        const r = 80 + i * 28 + Math.sin(t + i) * 8;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${135 + i * 18}, 60%, 55%, ${0.05 + i * 0.018})`;
        ctx.stroke();
      }
      ctx.restore();
    }

    function updateFps(now) {
      const delta = now - lastFrameTime;
      lastFrameTime = now;
      fpsAccumulator += 1000 / Math.max(1, delta);
      fpsFrames++;
      if (now - fpsLastUpdate > 500) {
        fpsText.textContent = Math.round(fpsAccumulator / fpsFrames) + ' FPS';
        fpsAccumulator = 0;
        fpsFrames = 0;
        fpsLastUpdate = now;
      }
      return delta;
    }

    function animate(now = performance.now()) {
      const delta = updateFps(now);

      if (!analyser || !freqData || !timeData) {
        drawIdle();
        animationId = requestAnimationFrame(animate);
        return;
      }

      updateAudioMetrics();
      fadeCanvas();

      const mode = modeSelect.value;
      if (mode === 'bars') drawBars();
      else if (mode === 'circle') drawCircle();
      else if (mode === 'wave') drawWaveTunnel();
      else if (mode === 'particles') drawParticles(delta);

      animationId = requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
